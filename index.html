<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0c" />
  <meta name="description" content="Tattoo Social — タトゥー作品を見つけ、アーティストとつながるためのSNS。" />
  <title>Tattoo Social</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#feed" aria-label="Tattoo Social ホーム">
        <span class="brand-mark">TS</span>
        <span class="brand-copy">Tattoo<br>Social</span>
      </a>
      <nav class="side-nav" aria-label="メインナビゲーション">
        <button data-route="feed" class="nav-item active"><span>⌂</span><b>フィード</b></button>
        <button data-route="discover" class="nav-item"><span>⌕</span><b>見つける</b></button>
        <button data-route="saved" class="nav-item"><span>◇</span><b>保存済み</b></button>
        <button data-route="notifications" class="nav-item"><span>○</span><b>通知</b><em id="notificationBadge" hidden></em></button>
        <button data-route="profile" class="nav-item"><span>◉</span><b>プロフィール</b></button>
      </nav>
      <button id="newPostBtn" class="primary-action">＋ 新規投稿</button>
      <div class="sidebar-bottom">
        <div id="connectionBadge" class="connection-badge">デモモード</div>
        <button id="authBtn" class="text-button">ログイン</button>
      </div>
    </aside>

    <main class="main-panel">
      <header class="mobile-header">
        <a class="mobile-brand" href="#feed">Tattoo Social</a>
        <button id="mobileNewPost" class="icon-button" aria-label="新規投稿">＋</button>
      </header>
      <section id="screen" class="screen" aria-live="polite"></section>
    </main>

    <aside class="right-rail">
      <div class="rail-search">
        <input id="globalSearch" type="search" placeholder="作品・スタイル・アーティストを検索" autocomplete="off" />
      </div>
      <section class="rail-card">
        <div class="rail-card-head"><h3>スタイル</h3><button data-route="discover">すべて見る</button></div>
        <div id="styleChips" class="style-chips"></div>
      </section>
      <section class="rail-card">
        <div class="rail-card-head"><h3>おすすめアーティスト</h3></div>
        <div id="suggestedArtists" class="artist-list"></div>
      </section>
    </aside>

    <nav class="bottom-nav" aria-label="モバイルナビゲーション">
      <button data-route="feed" class="active"><span>⌂</span><small>フィード</small></button>
      <button data-route="discover"><span>⌕</span><small>検索</small></button>
      <button id="bottomNewPost" class="new-post-circle" aria-label="新規投稿">＋</button>
      <button data-route="notifications"><span>○</span><small>通知</small></button>
      <button data-route="profile"><span>◉</span><small>自分</small></button>
    </nav>
  </div>

  <dialog id="postDialog" class="modal">
    <form id="postForm" method="dialog" class="modal-card">
      <div class="modal-head">
        <div><p class="eyebrow">新規投稿</p><h2>作品を投稿する</h2></div>
        <button type="button" class="icon-button modal-close" aria-label="閉じる">×</button>
      </div>
      <label class="upload-zone" id="uploadZone">
        <input id="postImage" type="file" accept="image/*" hidden required />
        <div id="uploadPreview" class="upload-preview"><span>＋</span><strong>タトゥー画像を追加</strong><small>JPG / PNG / WEBP</small></div>
      </label>
      <label class="field"><span>キャプション</span><textarea id="postCaption" rows="3" maxlength="280" placeholder="デザイン、施術部位、作品の背景など"></textarea></label>
      <label class="field"><span>タグ</span><input id="postTags" maxlength="100" placeholder="fine line, floral, blackwork" /></label>
      <div class="modal-actions"><button type="button" class="secondary-button modal-close">キャンセル</button><button id="publishBtn" type="submit" class="primary-action">投稿する</button></div>
    </form>
  </dialog>

  <dialog id="authDialog" class="modal">
    <form id="authForm" method="dialog" class="modal-card compact">
      <div class="modal-head">
        <div><p class="eyebrow">アカウント</p><h2 id="authTitle">ログイン</h2></div>
        <button type="button" class="icon-button auth-close" aria-label="閉じる">×</button>
      </div>
      <label class="field"><span>メールアドレス</span><input id="authEmail" type="email" required autocomplete="email" /></label>
      <label class="field"><span>パスワード</span><input id="authPassword" type="password" minlength="6" required autocomplete="current-password" /></label>
      <button id="authSubmit" type="submit" class="primary-action full">ログイン</button>
      <button id="authSwitch" type="button" class="text-button centered">新しいアカウントを作成</button>
      <p id="authHint" class="form-hint">デモモードはアカウントなしで利用できます。Supabase接続後は実際の複数ユーザーで利用できます。</p>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
